name: Publicar versión

# Al subir una etiqueta vX.Y.Z (npm run release X.Y.Z) compila el instalador y lo publica como Release.
# Las apps instaladas consultan ese Release al abrirse y ofrecen actualizarse.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node desktop/build.mjs
      # Un solo Release con el instalador, su mapa de bloques y latest.yml (lo que lee el actualizador)
      - name: Publicar Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" desktop/release/* --title "LabTrace ${GITHUB_REF_NAME#v}" --generate-notes
