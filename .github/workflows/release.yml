name: Publicar versión

# Al subir una etiqueta vX.Y.Z (npm run release X.Y.Z) compila el instalador y lo publica como Release.
# Las apps instaladas consultan ese Release al abrirse y ofrecen actualizarse.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node desktop/build.mjs --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
